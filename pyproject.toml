[project]
name = "erpnext"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io"}
]
description = "Open Source ERP"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # Core dependencies
    "python-stdnum~=1.16",
    "Unidecode~=1.2.0",

    # integration dependencies
    "googlemaps",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle's whitespace and blank-line rules (E1, E2, E3) are preview-only
preview = true
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
    "Q",
    "COM812",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E113", # unexpected indentation: Python rejects the real cases, and it misreads tabs in SQL strings
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
    "RUF005", # collection literal concatenation: the fix puts multi-line lists on one line
    "RUF015", # next(iter(x)) over list(x)[0]: raises StopIteration instead of IndexError on empty input
    "RUF067", # code in __init__.py: frappe apps keep module-level helpers there (preview rule)
    "RUF069", # float equality: changing these comparisons would change amounts and validations (preview rule)
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "RUF201", # rule codes in config instead of names (preview rule)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
