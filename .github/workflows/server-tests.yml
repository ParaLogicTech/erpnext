name: Server

on:
  push:
    branches:
      - version-15
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  schedule:
    # Weekly, Sunday 00:00 UTC, to catch frappe and crm changes that break erpnext
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      frappe_repo:
        description: "Frappe repository to test against (e.g. a fork with a pending change)"
        default: "ParaLogicTech/frappe"
        type: string
      frappe_branch:
        description: "Frappe branch"
        default: "version-15"
        type: string
      crm_repo:
        description: "CRM repository to test against (e.g. a fork with a pending change)"
        default: "ParaLogicTech/crm"
        type: string
      crm_branch:
        description: "CRM branch"
        default: "version-15"
        type: string

concurrency:
  group: server-${{ github.event_name }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      mariadb:
        image: mariadb:10.6.24
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Check for valid Python & Merge Conflicts
        run: |
          python3 -m compileall -q -f "${GITHUB_WORKSPACE}"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Bench
        uses: ./.github/actions/setup-bench
        with:
          frappe_repo: ${{ inputs.frappe_repo }}
          frappe_branch: ${{ inputs.frappe_branch }}
          crm_repo: ${{ inputs.crm_repo }}
          crm_branch: ${{ inputs.crm_branch }}
          github_token: ${{ github.token }}

      # A fresh install marks patches as done, so this checks that syncing again works, not the patches
      - name: Migrate
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate

      # compileall only checks syntax: this catches imports of names that no longer exist in frappe or crm
      - name: Import All Modules
        working-directory: /home/runner/frappe-bench/sites
        run: |
          ../env/bin/python - <<'EOF'
          import importlib
          import pkgutil
          import sys

          import frappe

          frappe.init(site="test_site", sites_path=".")
          frappe.connect()

          import erpnext

          failed = []
          count = 0

          def on_package_error(name):
              failed.append((name, repr(sys.exc_info()[1])))

          for module in pkgutil.walk_packages(erpnext.__path__, "erpnext.", onerror=on_package_error):
              count += 1
              try:
                  importlib.import_module(module.name)
              except Exception as e:
                  failed.append((module.name, repr(e)))

          frappe.db.rollback()
          frappe.destroy()

          print(f"Imported {count - len(failed)} of {count} modules")
          for name, error in failed:
              print(f"::error::{name}: {error}")

          sys.exit(1 if failed else 0)
          EOF

      - name: Build
        working-directory: /home/runner/frappe-bench
        run: bench build

      - name: Show bench output
        if: ${{ always() }}
        run: |
          # an earlier failure has no bench output to show
          cd /home/runner/frappe-bench 2>/dev/null || exit 0
          cat bench_start.log || true
          for f in logs/*.log*; do
            echo "Printing log: $f"
            cat "$f"
          done

  # One fresh site per module: tests leave data behind, and a module's tests mustn't depend on another's
  test:
    name: Test (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Module Defs in modules.txt that have tests (ERPNext Integrations has none)
        module:
          - Accounts
          - Assets
          - Buying
          - HR
          - Maintenance
          - Manufacturing
          - Projects
          - Quality Management
          - Regional
          - Selling
          - Setup
          - Stock
          - Support
          - Utilities
          - Vehicles

    services:
      mariadb:
        image: mariadb:10.6.24
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Bench
        uses: ./.github/actions/setup-bench
        with:
          frappe_repo: ${{ inputs.frappe_repo }}
          frappe_branch: ${{ inputs.frappe_branch }}
          crm_repo: ${{ inputs.crm_repo }}
          crm_branch: ${{ inputs.crm_branch }}
          github_token: ${{ github.token }}

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app erpnext --module-def "${MODULE}"
        env:
          MODULE: ${{ matrix.module }}

      - name: Show bench output
        if: ${{ always() }}
        run: |
          # an earlier failure has no bench output to show
          cd /home/runner/frappe-bench 2>/dev/null || exit 0
          cat bench_start.log || true
          for f in logs/*.log*; do
            echo "Printing log: $f"
            cat "$f"
          done
