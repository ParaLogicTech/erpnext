exclude: '(^|/)(node_modules|\.git)/'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
        files: "erpnext.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  # Lint with autofix only, no formatter: line breaks and bracket layout stay as written
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        name: "Run ruff linter and apply fixes"
        args: ["--fix"]

  - repo: local
    hooks:
      - id: eslint
        name: "Run eslint and apply fixes"
        entry: eslint --fix --quiet
        language: node
        language_version: "22.23.0"
        types_or: [javascript]
        additional_dependencies:
          - "eslint@9.39.5"
          - "@eslint/js@9.39.5"
          - "@stylistic/eslint-plugin@5.10.0"
          - "globals@17.14.0"
        # Ignore files that contain jinja (not valid JS) or bundles
        exclude: |
            (?x)^(
                erpnext/public/dist/.*|
                .*node_modules.*|
                erpnext/accounts/doctype/payment_entry/payment_entry.js|
                erpnext/accounts/doctype/pos_profile/pos_profile.js|
                erpnext/accounts/doctype/proforma_invoice/proforma_invoice.js|
                erpnext/accounts/doctype/purchase_invoice/purchase_invoice.js|
                erpnext/accounts/doctype/purchase_invoice/regional/india.js|
                erpnext/accounts/doctype/purchase_taxes_and_charges_template/purchase_taxes_and_charges_template.js|
                erpnext/accounts/doctype/sales_invoice/regional/india.js|
                erpnext/accounts/doctype/sales_invoice/regional/italy.js|
                erpnext/accounts/doctype/sales_invoice/sales_invoice.js|
                erpnext/accounts/doctype/sales_taxes_and_charges_template/sales_taxes_and_charges_template.js|
                erpnext/buying/doctype/purchase_order/purchase_order.js|
                erpnext/buying/doctype/purchase_order/regional/india.js|
                erpnext/buying/doctype/request_for_quotation/request_for_quotation.js|
                erpnext/buying/doctype/supplier/regional/india.js|
                erpnext/buying/doctype/supplier_quotation/supplier_quotation.js|
                erpnext/hr/doctype/employee_promotion/employee_promotion.js|
                erpnext/hr/doctype/employee_transfer/employee_transfer.js|
                erpnext/hr/doctype/loan/loan.js|
                erpnext/hr/doctype/loan_application/loan_application.js|
                erpnext/hr/doctype/salary_structure/salary_structure.js|
                erpnext/public/js/controllers/buying.js|
                erpnext/regional/report/gst_itemised_purchase_register/gst_itemised_purchase_register.js|
                erpnext/regional/report/gst_itemised_sales_register/gst_itemised_sales_register.js|
                erpnext/regional/report/gst_purchase_register/gst_purchase_register.js|
                erpnext/regional/report/gst_sales_register/gst_sales_register.js|
                erpnext/regional/report/hsn_wise_summary_of_outward_supplies/hsn_wise_summary_of_outward_supplies.js|
                erpnext/selling/doctype/customer/regional/india.js|
                erpnext/selling/doctype/quotation/quotation.js|
                erpnext/selling/doctype/sales_order/regional/india.js|
                erpnext/selling/doctype/sales_order/sales_order.js|
                erpnext/selling/sales_common.js|
                erpnext/stock/doctype/delivery_note/delivery_note.js|
                erpnext/stock/doctype/delivery_note/regional/india.js|
                erpnext/stock/doctype/material_request/material_request.js|
                erpnext/stock/doctype/purchase_receipt/purchase_receipt.js|
                erpnext/stock/doctype/purchase_receipt/regional/india.js
            )$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['conventional-changelog-conventionalcommits']

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
